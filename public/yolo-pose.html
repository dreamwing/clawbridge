<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOLO11 骨架偵測 - 羽球教練</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #F97316;
      --secondary: #FB923C;
      --accent: #16A34A;
      --bg: #F8FAFC;
      --fg: #0F172A;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --muted: #94A3B8;
    }

    body {
      font-family: 'Barlow', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--fg);
      margin-right: 12px;
    }

    .header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
    }

    .header .badge {
      background: var(--primary);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--card);
      margin-bottom: 20px;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: #FFF7ED;
    }

    .upload-zone .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-zone h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      color: var(--fg);
      margin-bottom: 6px;
    }

    .upload-zone p {
      font-size: 14px;
      color: var(--muted);
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      margin-top: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover { background: #ea580c; }

    /* Result Card */
    .result-card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
    }

    .result-card.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .result-header .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .result-header h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }

    .result-header .time {
      font-size: 13px;
      color: var(--muted);
    }

    .result-image-wrap {
      position: relative;
      background: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      max-height: 70vh;
      overflow: hidden;
    }

    .result-image-wrap img {
      max-width: 100%;
      max-height: 70vh;
      display: block;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 16px;
    }

    .stat-item .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-item .value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--fg);
    }

    .stat-item .value.orange { color: var(--primary); }

    /* Player List */
    .player-list {
      padding: 16px 20px;
    }

    .player-list h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .player-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }

    .player-conf {
      font-size: 13px;
      color: var(--muted);
    }

    /* Loading */
    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay.visible { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: white;
      font-weight: 600;
      font-size: 16px;
    }

    .loading-sub {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 12px;
      padding: 16px;
      color: #DC2626;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error-msg.visible { display: block; }

    /* Sample Images */
    .sample-section {
      margin-top: 24px;
    }

    .sample-section h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .sample-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .sample-img {
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .sample-img:hover { border-color: var(--primary); }

    /* Info Banner */
    .info-banner {
      background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
      border: 1px solid #FED7AA;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #92400E;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .info-banner .icon { font-size: 20px; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="header">
  <a href="menu.html" class="back-btn">←</a>
  <h1>🏸 YOLO11 骨架偵測 <span class="badge">BETA</span></h1>
</div>

<div class="container">
  <div class="info-banner">
    <span class="icon">💡</span>
    <div>
      <strong>YOLO11-Pose</strong> 多人骨架偵測，適用於羽球、籃球、排球等多人物場景。<br>
      上傳圖片（建議 720p 以上），自動標示所有人員骨架與信心度。
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- Upload Zone -->
  <div class="upload-zone" id="uploadZone">
    <div class="icon">📷</div>
    <h3>上傳羽球照片</h3>
    <p>支援 JPG、PNG，建議解析度 720p 以上</p>
    <label class="upload-btn">選擇圖片
      <input type="file" accept="image/*" id="fileInput">
    </label>
    <p style="margin-top:8px; font-size:12px; color: var(--muted);">或拖曳圖片到這裡</p>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="status-dot"></div>
      <h3 id="resultTitle">YOLO11 骨架偵測結果</h3>
      <span class="time" id="resultTime"></span>
    </div>
    <div class="result-image-wrap" id="imageWrap">
      <img id="resultImage" src="" alt="骨架偵測結果">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">YOLO11 偵測中...</div>
        <div class="loading-sub">多人姿態分析</div>
      </div>
    </div>
    <div class="result-stats" id="statsRow">
      <!-- filled by JS -->
    </div>
    <div class="player-list" id="playerList">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- Sample Images -->
  <div class="sample-section">
    <h4>📸 快速測試</h4>
    <div class="sample-grid">
      <img src="https://clawbridge.myclawdomain.ccwu.cc/badminton-coach/test-badminton.jpg"
           class="sample-img" onclick="analyzeImage(this.src)" title="測試圖1">
      <img src="https://clawbridge.myclawdomain.ccwu.cc/badminton-coach/test-badminton2.jpg"
           class="sample-img" onclick="analyzeImage(this.src)" title="測試圖2">
      <img src="https://clawbridge.myclawdomain.ccwu.cc/badminton-coach/test-badminton3.jpg"
           class="sample-img" onclick="analyzeImage(this.src)" title="測試圖3">
    </div>
  </div>
</div>

<script>
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const resultCard = document.getElementById('resultCard');
  const resultImage = document.getElementById('resultImage');
  const resultTime = document.getElementById('resultTime');
  const statsRow = document.getElementById('statsRow');
  const playerList = document.getElementById('playerList');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const errorMsg = document.getElementById('errorMsg');

  const API_BASE = 'https://clawbridge.myclawdomain.ccwu.cc/api/badminton';

  // Colors for players (matching yolo_pose.py COLORS)
  const PLAYER_COLORS = ['#00B4FF','#00FF64','#FF5050','#B478FF','#FFB400','#64C8FF'];

  // Drag & Drop
  uploadZone.addEventListener('dragover', e => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  async function handleFile(file) {
    showLoading(true);
    hideError();

    const formData = new FormData();
    formData.append('image', file);

    try {
      const resp = await fetch(`${API_BASE}/yolo-pose`, {
        method: 'POST',
        body: formData,
      });

      const data = await resp.json();
      showLoading(false);

      if (!data.ok) {
        showError(data.error || '偵測失敗，請重試');
        return;
      }

      showResult(data);
    } catch (e) {
      showLoading(false);
      showError('網路錯誤：' + e.message);
    }
  }

  // Analyze image from URL (for sample images)
  async function analyzeImage(url) {
    showLoading(true);
    hideError();

    try {
      // Fetch image as blob, then send
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], 'sample.jpg', { type: 'image/jpeg' });

      const formData = new FormData();
      formData.append('image', file);

      const apiResp = await fetch(`${API_BASE}/yolo-pose`, {
        method: 'POST',
        body: formData,
      });

      const data = await apiResp.json();
      showLoading(false);

      if (!data.ok) {
        showError(data.error || '偵測失敗');
        return;
      }

      showResult(data);
    } catch (e) {
      showLoading(false);
      showError('網路錯誤：' + e.message);
    }
  }

  function showResult(data) {
    resultCard.classList.add('visible');
    resultImage.src = data.result_image_url + '?t=' + Date.now();
    resultTime.textContent = data.timestamp || '';

    // Stats
    const conf = data.avg_confidence;
    statsRow.innerHTML = `
      <div class="stat-item">
        <div class="label">偵測人數</div>
        <div class="value orange">${data.player_count}</div>
      </div>
      <div class="stat-item">
        <div class="label">平均信心度</div>
        <div class="value">${(conf * 100).toFixed(0)}%</div>
      </div>
      <div class="stat-item">
        <div class="label">圖片解析度</div>
        <div class="value">${data.image_width}×${data.image_height}</div>
      </div>
      <div class="stat-item">
        <div class="label">模型</div>
        <div class="value" style="font-size:16px">YOLO11-Pose</div>
      </div>
    `;

    // Player list
    if (data.players && data.players.length > 0) {
      playerList.innerHTML = '<h4>球員偵測結果</h4>' +
        data.players.map((p, i) => `
          <div class="player-row">
            <div class="player-color" style="background:${PLAYER_COLORS[i % PLAYER_COLORS.length]}"></div>
            <div class="player-name">${p.id}</div>
            <div class="player-conf">信心度 ${(p.confidence * 100).toFixed(0)}%</div>
          </div>
        `).join('');
    } else {
      playerList.innerHTML = '';
    }

    // Scroll to result
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showLoading(visible) {
    loadingOverlay.classList.toggle('visible', visible);
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function hideError() {
    errorMsg.classList.remove('visible');
  }
</script>
</body>
</html>
